<!-- Histórico individual (Gate 1-F3): a lista é renderizada por App.CRUDCollaborators.showHistory. -->
<dialog id="collab-history-modal" class="ui-modal collab-history-modal" aria-labelledby="collab-history-title">
  <div class="ui-modal__header">
    <div>
      <h2 id="collab-history-title" class="ui-modal__title">Histórico individual</h2>
      <p id="collab-history-name" class="ui-modal__description">Nome do colaborador</p>
    </div>
    <button type="button" class="ui-icon-btn ui-icon-btn--ghost" data-modal-close aria-label="Fechar">
      <svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>
  <div class="ui-modal__body">
    <div id="collab-history-list"></div>
  </div>
  <div class="ui-modal__footer">
    <button type="button" class="ui-btn ui-btn--secondary" data-modal-close>
      <span class="ui-btn__label">Fechar</span>
    </button>
  </div>
</dialog>
