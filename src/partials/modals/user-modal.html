<!-- Formulário de usuário (Gate 1-F4.D1): componentes do design system e rótulos associados aos
     campos. Campos, validação e envio inalterados; os ids (crud-user-*, user-modal-*,
     btn-save-user-text) têm consumidores em users.js e nos testes. -->
<dialog
  data-dismissible="false"
  id="crud-user-modal"
  class="ui-modal"
  aria-labelledby="user-modal-title"
>
  <div class="ui-modal__header">
    <h2 id="user-modal-title" class="ui-modal__title">Novo Usuário</h2>
    <button
      type="button"
      onclick="App.CRUDUsers.closeModal()"
      class="ui-icon-btn ui-icon-btn--ghost"
      aria-label="Fechar"
    >
      <svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>
  <div class="ui-modal__body">
    <input type="hidden" id="crud-user-id" />
    <p id="user-modal-subtitle" class="ui-modal__description">
      Cadastre um novo colaborador no sistema
    </p>
    <div class="ui-field">
      <label class="ui-label" for="crud-user-name">Nome Completo</label>
      <input id="crud-user-name" type="text" class="ui-control" required />
    </div>
    <div class="ui-field">
      <label class="ui-label" for="crud-user-email">E-mail</label>
      <input id="crud-user-email" type="email" class="ui-control" required />
    </div>
    <div class="ui-field">
      <label class="ui-label" for="crud-user-department">Departamento / Setor</label>
      <input
        id="crud-user-department"
        type="text"
        class="ui-control"
        placeholder="Ex: Engenharia, TI, RH"
      />
    </div>
    <div class="ui-field">
      <label class="ui-label" for="crud-user-access">Nível de Acesso</label>
      <div class="ui-select">
        <select id="crud-user-access" class="ui-control">
          <option value="Usuário Padrão">Usuário Padrão</option>
          <option value="Administrador">Administrador</option>
        </select>
        <svg class="ui-select__chevron" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
      </div>
    </div>
  </div>
  <div class="ui-modal__footer">
    <button
      type="button"
      onclick="App.CRUDUsers.closeModal()"
      class="ui-btn ui-btn--secondary"
    >
      <span class="ui-btn__label">Cancelar</span>
    </button>
    <button
      type="button"
      onclick="App.CRUDUsers.saveUser()"
      class="ui-btn ui-btn--primary"
    >
      <span id="btn-save-user-text" class="ui-btn__label">Cadastrar</span>
    </button>
  </div>
</dialog>
