<dialog
  id="profile-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(var(--app-height)-2rem)] open:grid grid-rows-[auto_minmax(0,1fr)_auto] backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
    <div class="bg-slate-900 p-5 text-center relative shrink-0">
      <!-- Avatar estático -->
      <div
        class="w-16 h-16 bg-brand-600 rounded-full flex items-center justify-center text-white font-bold text-xl mx-auto shadow-lg shadow-brand-600/30 border-4 border-slate-800 overflow-hidden"
        id="profile-modal-avatar"
      >
        <svg
          class="w-7 h-7"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
          />
        </svg>
      </div>
      <h3 id="profile-modal-name" class="text-xl font-extrabold text-white mt-3">Usuário</h3>
      <p
        id="profile-modal-role"
        class="text-xs font-bold text-brand-400 uppercase tracking-widest"
      >
        Role
      </p>
      <button
        type="button"
        onclick="App.Auth.closeProfileModal()"
        class="absolute top-4 right-4 text-slate-400 hover:text-white"
      >
            <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>
    <div class="p-5 space-y-2 overflow-y-auto min-h-0">
      <!-- Email com ícone e botão de copiar -->
      <div
        class="flex justify-between items-center px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl group hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      >
        <div class="flex items-center gap-3">
          <svg
            class="w-5 h-5 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <span
            class="text-xs font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >E-mail:</span
          >
        </div>
        <div class="flex items-center gap-2 min-w-0">
          <span
            id="profile-modal-email"
            class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate whitespace-nowrap max-w-[150px]"
            title=""
            >Sem e-mail</span
          >
          <button
            type="button"
            onclick="App.UI.copyToClipboard('profile-modal-email')"
            class="opacity-0 group-hover:opacity-100 p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded transition-all"
            title="Copiar email"
          >
            <svg
              class="w-4 h-4 text-slate-400 hover:text-brand-500"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Dispositivo com ícone -->
      <div
        class="flex justify-between items-center px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl group hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      >
        <div class="flex items-center gap-3">
          <svg
            class="w-5 h-5 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
            <path d="M12 18h.01" />
          </svg>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"
            >Dispositivo:</span
          >
        </div>
        <span
          id="profile-modal-device"
          class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate max-w-[150px]"
          >Desconhecido</span
        >
      </div>

      <!-- IP com ícone e botão de copiar -->
      <div
        class="flex justify-between items-center px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl group hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      >
        <div class="flex items-center gap-3">
          <svg
            class="w-5 h-5 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="2" x2="22" y1="12" y2="12" />
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"
            >IP Atual:</span
          >
        </div>
        <div class="flex items-center gap-2">
          <span
            id="profile-modal-ip"
            class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate max-w-[150px]"
            >Desconhecido</span
          >
          <button
            type="button"
            onclick="App.UI.copyToClipboard('profile-modal-ip')"
            class="opacity-0 group-hover:opacity-100 p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded transition-all"
            title="Copiar IP"
          >
            <svg
              class="w-4 h-4 text-slate-400 hover:text-brand-500"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Último Login (NOVO) -->
      <div
        class="flex justify-between items-center px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl group hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      >
        <div class="flex items-center gap-3">
          <svg
            class="w-5 h-5 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"
            >Último Login:</span
          >
        </div>
        <span
          id="profile-modal-last-login"
          class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate max-w-[150px]"
          >-</span
        >
      </div>

      <!-- Conta Criada Em (NOVO) -->
      <div
        class="flex justify-between items-center px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl group hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
      >
        <div class="flex items-center gap-3">
          <svg
            class="w-5 h-5 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
            <line x1="16" x2="16" y1="2" y2="6" />
            <line x1="8" x2="8" y1="2" y2="6" />
            <line x1="3" x2="21" y1="10" y2="10" />
          </svg>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"
            >Conta Criada:</span
          >
        </div>
        <span
          id="profile-modal-account-created"
          class="text-sm font-bold text-slate-700 dark:text-slate-300 truncate max-w-[150px]"
          >-</span
        >
      </div>
    </div>
    <div class="p-5 border-t border-slate-100 dark:border-slate-800 space-y-2 shrink-0">
      <button
        type="button"
        onclick="
          App.Auth.closeProfileModal();
          App.Auth.openPasswordModal();
        "
        class="w-full py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center justify-center gap-2"
      >
        <svg
          class="w-4 h-4"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        Alterar Senha
      </button>
      <button
        type="button"
        onclick="
          App.Auth.closeProfileModal();
          App.Auth.logout();
        "
        class="w-full py-2.5 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 font-bold rounded-xl hover:bg-rose-100 dark:hover:bg-rose-900/40 transition-colors flex items-center justify-center gap-2"
      >
        <svg
          class="w-4 h-4"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" x2="12" y1="3" y2="15" />
        </svg>
        Sair do Sistema
      </button>
    </div>
</dialog>
