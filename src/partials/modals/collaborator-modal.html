<!-- Formulário de colaborador (Gate 1-F3): componentes do design system, rótulos sempre visíveis e
     mensagem de erro ligada ao campo. Campos, obrigatoriedade, validação e persistência inalterados;
     os ids (crud-collab-*) têm consumidores em collaborators.js e nos testes. -->
<dialog
  data-dismissible="false"
  id="crud-collab-modal"
  class="ui-modal"
  aria-labelledby="collab-modal-title"
>
  <div class="ui-modal__header">
    <h2 id="collab-modal-title" class="ui-modal__title">Novo Colaborador</h2>
    <button type="button" class="ui-icon-btn ui-icon-btn--ghost" data-modal-close aria-label="Fechar">
      <svg class="ui-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>
  <div class="ui-modal__body">
    <div class="collab-form">
      <input type="hidden" id="crud-collab-id" />

      <div class="ui-field">
        <label class="ui-label" for="crud-collab-badge"
          >Crachá / Ponto<span class="ui-required" aria-hidden="true"> *</span></label
        >
        <input
          class="ui-control"
          id="crud-collab-badge"
          type="text"
          required
          autocomplete="off"
          aria-describedby="crud-collab-badge-help crud-collab-badge-error"
        />
        <p class="ui-help" id="crud-collab-badge-help">
          Identificador usado no Scanner para retirar e devolver ferramentas.
        </p>
        <p class="ui-error" id="crud-collab-badge-error" hidden></p>
      </div>

      <div class="ui-field">
        <label class="ui-label" for="crud-collab-name"
          >Nome<span class="ui-required" aria-hidden="true"> *</span></label
        >
        <input
          class="ui-control"
          id="crud-collab-name"
          type="text"
          required
          autocomplete="off"
          aria-describedby="crud-collab-name-error"
        />
        <p class="ui-error" id="crud-collab-name-error" hidden></p>
      </div>

      <div class="collab-form__row">
        <div class="ui-field">
          <label class="ui-label" for="crud-collab-role">Cargo</label>
          <input
            class="ui-control"
            id="crud-collab-role"
            type="text"
            autocomplete="off"
            aria-describedby="crud-collab-role-error"
          />
          <p class="ui-error" id="crud-collab-role-error" hidden></p>
        </div>

        <div class="ui-field">
          <label class="ui-label" for="crud-collab-phone">Telefone / WhatsApp</label>
          <input
            class="ui-control"
            id="crud-collab-phone"
            type="tel"
            inputmode="tel"
            placeholder="Ex: 11999999999"
            autocomplete="off"
            aria-describedby="crud-collab-phone-error"
          />
          <p class="ui-error" id="crud-collab-phone-error" hidden></p>
        </div>
      </div>

      <div class="ui-field">
        <span class="ui-label" id="crud-collab-photo-label">Foto</span>
        <div class="collab-photo">
          <span class="collab-photo__preview">
            <img id="crud-collab-image-preview" src="" alt="" class="hidden" />
            <svg id="collab-image-icon" class="ui-icon" aria-hidden="true">
              <use href="#icon-users"></use>
            </svg>
          </span>
          <input
            type="file"
            id="crud-collab-image"
            class="collab-photo__input"
            accept="image/*"
            aria-labelledby="crud-collab-photo-label crud-collab-image-label"
          />
          <label class="collab-photo__label" id="crud-collab-image-label" for="crud-collab-image">
            Enviar foto
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="ui-modal__footer">
    <button type="button" class="ui-btn ui-btn--secondary" data-modal-close>
      <span class="ui-btn__label">Cancelar</span>
    </button>
    <button
      id="btn-save-collab"
      type="button"
      class="ui-btn ui-btn--primary"
      data-collab-action="save"
    >
      <span class="ui-btn__label">Salvar</span>
    </button>
  </div>
</dialog>
