<dialog
  data-dismissible="false"
  id="tool-maintenance-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(var(--app-height)-2rem)] open:flex open:flex-col backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
  <form
    id="tool-maintenance-form"
    onsubmit="event.preventDefault(); App.CRUDTools.saveMaintenance();"
    class="flex min-h-0 flex-1 flex-col"
  >
    <div
      class="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between shrink-0"
    >
      <div>
        <h3 class="text-xl font-extrabold text-slate-900 dark:text-white">
          Registrar Manutenção
        </h3>
        <p
          id="tool-maintenance-name"
          class="text-sm font-bold text-rose-600 dark:text-rose-400 mt-0.5"
        >
          Nome da ferramenta
        </p>
      </div>

      <button
        type="button"
        onclick="App.CRUDTools.closeMaintenanceModal()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
        aria-label="Fechar"
      >
        <svg class="w-6 h-6" aria-hidden="true">
          <use href="#icon-close"></use>
        </svg>
      </button>
    </div>

    <div class="p-5 space-y-4 overflow-y-auto flex-1 min-h-0">
      <input type="hidden" id="tool-maintenance-id" />

      <div>
        <label
          for="tool-maintenance-performed-at"
          class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >
          Manutenção realizada em
        </label>
        <input
          type="date"
          id="tool-maintenance-performed-at"
          required
          class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500/20"
        />
      </div>

      <div>
        <label
          for="tool-maintenance-next"
          class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >
          Próxima manutenção
        </label>
        <input
          type="date"
          id="tool-maintenance-next"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500/20"
        />
        <p class="mt-1.5 text-xs text-slate-400">
          Campo opcional.
        </p>
      </div>

      <div>
        <label
          for="tool-maintenance-notes"
          class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >
          Serviço realizado e observações
        </label>
        <textarea
          id="tool-maintenance-notes"
          maxlength="1000"
          rows="4"
          placeholder="Descreva a revisão, reparo, calibração ou peças substituídas."
          class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500/20 resize-y"
        ></textarea>
      </div>
    </div>

    <div
      class="p-5 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0 flex gap-3"
    >
      <button
        type="button"
        onclick="App.CRUDTools.closeMaintenanceModal()"
        class="flex-1 px-4 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
      >
        Cancelar
      </button>

      <button
        id="tool-maintenance-submit"
        type="submit"
        class="flex-1 px-4 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md shadow-rose-600/20 transition-all active:scale-95"
      >
        Registrar
      </button>
    </div>
  </form>
</dialog>
