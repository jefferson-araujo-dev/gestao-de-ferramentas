<dialog
  data-dismissible="false"
  id="password-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(100vh-2rem)] overflow-y-auto backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
  <div
    class="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center"
  >
    <h3 class="text-xl font-extrabold text-slate-900 dark:text-white">Alterar Senha</h3>
    <button
      type="button"
      onclick="App.Auth.closePasswordModal()"
      class="text-slate-400 hover:text-slate-600 transition-colors"
     aria-label="Fechar">
      <svg class="w-6 h-6" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>
  <form
    id="password-form"
    onsubmit="
      event.preventDefault();
      App.Auth.updateUserPassword();
    "
  >
    <div class="p-6 space-y-5">
      <!-- Nova Senha -->
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
          >Nova Senha</label
        >
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>

          <input
            id="new-password"
            type="password"
            class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white placeholder-slate-400"
            placeholder="Digite sua nova senha"
          />

          <button
            type="button"
            onclick="App.Auth.togglePasswordVisibility('new-password', 'toggle-new-pass')"
            id="toggle-new-pass"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-500 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <div id="password-match-msg" class="text-[10px] font-bold mt-1.5 h-4"></div>

        <!-- Indicador de Força -->
        <div class="mt-2 h-1.5 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div
            id="password-strength-bar"
            class="h-full w-0 bg-red-500 transition-all duration-300 ease-out"
          ></div>
        </div>
        <p
          id="password-strength-text"
          class="text-[10px] font-bold text-slate-400 mt-1 text-right uppercase"
        >
          Muito Fraca
        </p>
      </div>

      <!-- Confirmar Senha -->
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
          >Confirmar Nova Senha</label
        >
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>

          <input
            id="confirm-password"
            type="password"
            class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white placeholder-slate-400"
            placeholder="Repita a nova senha"
          />

          <button
            type="button"
            onclick="App.Auth.togglePasswordVisibility('confirm-password', 'toggle-confirm-pass')"
            id="toggle-confirm-pass"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-500 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          onclick="App.Auth.closePasswordModal()"
          class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
        >
          Cancelar
        </button>

        <button
          type="submit"
          id="btn-save-password"
          class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-600/20 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          Atualizar
        </button>
      </div>
    </div>
  </form>
</dialog>
