<dialog
  data-dismissible="false"
  id="forgot-password-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(100vh-2rem)] overflow-y-auto backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
    <div class="p-8 text-center">
      <div
        class="w-16 h-16 bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 rounded-full flex items-center justify-center mx-auto mb-4"
      >
        <svg
          class="w-8 h-8"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-2">
        Criar ou recuperar senha
      </h3>
      <p class="text-slate-500 dark:text-slate-400 mb-6 text-sm">
        Informe seu e-mail corporativo para receber as instruções de criação ou redefinição de senha.
      </p>
      <input
        id="forgot-email-input"
        type="email"
        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white mb-4"
        placeholder="seu@e-mail.com"
      />
      <button
        id="btn-send-forgot"
        type="button"
        onclick="App.Auth.sendForgotEmail()"
        class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-600/20 transition-all active:scale-95"
      >
        Enviar instruções
      </button>
      <button
        type="button"
        onclick="App.Auth.closeForgotModal()"
        class="mt-4 text-sm text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold"
      >
        Cancelar
      </button>
    </div>
</dialog>
