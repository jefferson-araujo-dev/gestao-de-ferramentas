<dialog
  id="crud-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(var(--app-height)-2rem)] open:grid grid-rows-[auto_minmax(0,1fr)_auto] backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
  <div
    class="p-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between shrink-0"
  >
    <h3 id="modal-title" class="text-xl font-extrabold text-slate-900 dark:text-white">
      Nova Ferramenta
    </h3>
    <button
      type="button"
      onclick="App.CRUDTools.closeModal()"
      class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
    >
      <svg class="w-5 h-5" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
  </div>
  <div class="p-6 space-y-4 overflow-y-auto min-h-0">
    <input type="hidden" id="crud-id" />
    <input type="hidden" id="crud-condition" value="Bom" />
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label
          for="crud-next-maintenance"
          class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >
          Próxima Manutenção
        </label>
        <input
          type="date"
          id="crud-next-maintenance"
          class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-brand-500/20"
        />
      </div>
      <div>
        <label
          for="crud-manual"
          class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >
          Manual da Ferramenta
        </label>
        <div class="flex items-center gap-2">
          <label
            for="crud-manual"
            class="inline-flex items-center justify-center px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm font-bold cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
          >
            Selecionar PDF
          </label>
          <button
            id="btn-view-manual"
            type="button"
            onclick="App.CRUDTools.viewManual(event)"
            class="hidden text-sm font-bold text-brand-600 dark:text-brand-400 hover:underline"
          >
            Visualizar manual
          </button>
        </div>
        <input
          type="file"
          id="crud-manual"
          class="hidden"
          accept="application/pdf"
          aria-describedby="manual-file-name"
          onchange="App.CRUDTools.handleManualSelection(event)"
        />
        <p id="manual-file-name" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">
          Nenhum arquivo
        </p>
      </div>
    </div>
    <div>
      <label
        for="crud-notes"
        class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
      >
        Observações
      </label>
      <textarea
        id="crud-notes"
        rows="3"
        class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-brand-500/20 resize-y"
      ></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
          >Patrimônio / Cód</label
        >
        <input
          id="crud-code"
          type="text"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white"
          required
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
          >Categoria</label
        >
        <select
          id="crud-category"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white"
        >
          <option value="Elétrica">Elétrica</option>
          <option value="Mecânica">Mecânica</option>
          <option value="Medição">Medição</option>
          <option value="Manual">Manual</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >Descrição</label
      >
      <input
        id="crud-name"
        type="text"
        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white"
        required
      />
    </div>
    <div id="crud-status-container" class="hidden">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >Status</label
      >
      <select
        id="crud-status"
        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-brand-500/20 transition-all text-slate-900 dark:text-white"
      >
        <option value="available">Disponível</option>
        <option value="maintenance">Em Manutenção</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5"
        >Foto</label
      >
      <div class="flex items-center gap-4">
        <div
          class="w-20 h-20 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden"
        >
          <img id="crud-image-preview" src="" class="w-full h-full object-cover hidden" />
          <svg
            id="image-placeholder-icon"
            class="w-6 h-6 text-slate-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
        </div>
        <label
          class="flex-1 py-3 bg-white dark:bg-slate-800 border border-dashed border-slate-300 dark:border-slate-600 rounded-xl text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
        >
          <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Alterar Imagem</span>
          <input
            type="file"
            id="crud-image"
            class="hidden"
            accept="image/*"
            onchange="App.CRUDTools.handleImageSelection(event)"
          />
        </label>
      </div>
    </div>
  </div>
  <div
    class="p-6 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex gap-3 shrink-0"
  >
    <button
      type="button"
      onclick="App.CRUDTools.closeModal()"
      class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
    >
      Cancelar
    </button>
    <button
      id="btn-save-tool"
      type="button"
      onclick="App.CRUDTools.saveTool()"
      class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-600/20 transition-all active:scale-95"
    >
      Salvar
    </button>
  </div>
</dialog>
