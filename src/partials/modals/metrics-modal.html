<dialog
  id="metrics-modal"
  class="p-0 bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in max-h-[calc(var(--app-height)-2rem)] open:grid grid-rows-[auto_minmax(0,1fr)_auto] backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
    <div
      class="p-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between shrink-0"
    >
      <div>
        <h3 class="text-xl font-extrabold text-slate-900 dark:text-white">
          Métricas do Sistema
        </h3>
        <p class="text-sm font-bold text-sky-600 dark:text-sky-400 mt-0.5">
          Relatório de uso e performance
        </p>
      </div>
      <button
        type="button"
        onclick="App.UI.closeMetricsModal()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
      >
        <svg class="w-6 h-6" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>
    <div
      class="p-4 sm:p-6 overflow-y-auto min-h-0 bg-slate-50 dark:bg-slate-950"
      id="metrics-modal-content"
    >
      <!-- Conteúdo gerado via JS -->
    </div>
    <div
      class="p-4 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0 text-right"
    >
      <button
        type="button"
        onclick="App.UI.closeMetricsModal()"
        class="px-6 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors"
      >
        Fechar
      </button>
    </div>
</dialog>
