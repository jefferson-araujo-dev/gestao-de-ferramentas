<dialog
  id="logout-modal"
  class="p-6 bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden open:animate-fade-in text-center backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm"
>
  <div
    class="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-full flex items-center justify-center mx-auto mb-4"
  >
    <svg
      class="w-8 h-8"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" x2="9" y1="12" y2="12" />
    </svg>
  </div>
  <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-2">Sair do Sistema?</h3>
  <p class="text-slate-500 dark:text-slate-400 mb-6 text-sm">
    Você precisará fazer login novamente para acessar o inventário.
  </p>
  <div class="flex gap-3">
    <button
      type="button"
      onclick="App.Auth.closeLogoutModal()"
      class="flex-1 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
    >
      Cancelar
    </button>
    <button
      type="button"
      onclick="App.Auth.confirmLogout()"
      class="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md shadow-rose-600/20 transition-all active:scale-95"
    >
      Sair
    </button>
  </div>
</dialog>
