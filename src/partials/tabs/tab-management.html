<section id="tab-management" aria-labelledby="topbar-title" class="tab-content hidden space-y-5 md:space-y-6">
  <div class="panel-card panel-content">
    <!-- Header com contadores -->
    <div class="grid gap-4 lg:grid-cols-[minmax(280px,1fr)_auto] items-start">
    <div>
      <h3 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">
        Catálogo de Inventário
      </h3>
      <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mt-1 max-w-xl">
        Adicione, edite e gerencie suas ferramentas no inventário.
      </p>
      <!-- Contadores rápidos -->
      <div
        class="grid grid-cols-2 gap-2 sm:grid-cols-4 sm:gap-3 mt-3"
        id="inventory-stats"
      >
        <div
          class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-3 py-2.5 text-center shadow-sm"
        >
          <p class="text-lg sm:text-xl font-black text-brand-600" id="inv-stat-total">
            0
          </p>
          <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wide">
            Total
          </p>
        </div>
        <div
          class="rounded-2xl border border-emerald-200/70 dark:border-emerald-900/50 bg-emerald-50/70 dark:bg-emerald-950/20 px-3 py-2.5 text-center shadow-sm"
        >
          <p
            class="text-lg sm:text-xl font-black text-emerald-600"
            id="inv-stat-available"
          >
            0
          </p>
          <p
            class="text-[10px] text-emerald-700 dark:text-emerald-400 uppercase font-bold tracking-wide"
          >
            Disponíveis
          </p>
        </div>
        <div
          class="rounded-2xl border border-amber-200/70 dark:border-amber-900/50 bg-amber-50/70 dark:bg-amber-950/20 px-3 py-2.5 text-center shadow-sm"
        >
          <p class="text-lg sm:text-xl font-black text-amber-600" id="inv-stat-borrowed">
            0
          </p>
          <p
            class="text-[10px] text-amber-700 dark:text-amber-400 uppercase font-bold tracking-wide"
          >
            Emprestadas
          </p>
        </div>
        <div
          class="rounded-2xl border border-rose-200/70 dark:border-rose-900/50 bg-rose-50/70 dark:bg-rose-950/20 px-3 py-2.5 text-center shadow-sm"
        >
          <p
            class="text-lg sm:text-xl font-black text-rose-600"
            id="inv-stat-maintenance"
          >
            0
          </p>
          <p
            class="text-[10px] text-rose-700 dark:text-rose-400 uppercase font-bold tracking-wide"
          >
            Manutenção
          </p>
        </div>
      </div>
    </div>
    <div class="space-y-3">
      <div class="responsive-action-bar flex flex-wrap justify-start lg:justify-end gap-2 items-center pb-1 w-full lg:w-auto min-w-0 max-w-full">
        <button
          id="tools-action-export"
          type="button"
          onclick="App.CRUDTools.quickExport()"
          class="btn px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md shadow-emerald-600/20 transition-all active:scale-95 flex items-center gap-2 text-sm whitespace-nowrap shrink-0"
          title="Exportar lista completa"
        >
          <svg class="w-4 h-4 shrink-0" aria-hidden="true"><use href="#icon-download"></use></svg>
          Exportar
        </button>
        <button
          id="tools-action-import"
          type="button"
          onclick="document.getElementById('crud-import-input-tool').click()"
          class="btn px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold shadow-sm transition-all active:scale-95 flex items-center gap-2 text-sm whitespace-nowrap shrink-0"
        >
          <svg class="w-4 h-4 shrink-0" aria-hidden="true"><use href="#icon-import"></use></svg>
          Importar
        </button>
        <button
          id="tools-action-new"
          type="button"
          onclick="App.CRUDTools.openModal()"
          class="btn px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md shadow-brand-600/20 transition-all active:scale-95 flex items-center gap-2 text-sm whitespace-nowrap shrink-0"
        >
          <svg class="w-4 h-4 shrink-0" aria-hidden="true"><use href="#icon-plus"></use></svg>
          Nova
        </button>
      </div>
      <input
        type="file"
        id="crud-import-input-tool"
        class="hidden"
        accept=".xlsx, .xls"
        onchange="App.CRUDTools.importFile(event)"
      />
    </div>
  </div>

  <!-- Filtros Rápidos por Status -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="inventory-quick-filters">
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('all')"
      class="inv-filter-btn inline-flex items-center justify-center gap-1.5 whitespace-nowrap px-3 py-2.5 rounded-xl bg-brand-100 text-brand-700 text-[11px] sm:text-xs font-bold border border-brand-200 transition-all hover:scale-105"
      data-filter="all"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        <path
          d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
        />
        <path d="m3.3 7 8.7 5 8.7-5" />
        <path d="M12 22V12" />
      </svg>
      Todos
    </button>
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('available')"
      class="inv-filter-btn inline-flex items-center justify-center gap-1.5 whitespace-nowrap px-3 py-2.5 rounded-xl bg-emerald-100 text-emerald-700 text-[11px] sm:text-xs font-bold border border-emerald-200 transition-all hover:scale-105"
      data-filter="available"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      Dispon.:
      <span class="font-black" id="filter-inv-available">0</span>
    </button>
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('borrowed')"
      class="inv-filter-btn inline-flex items-center justify-center gap-1.5 whitespace-nowrap px-3 py-2.5 rounded-xl bg-amber-100 text-amber-700 text-[11px] sm:text-xs font-bold border border-amber-200 transition-all hover:scale-105"
      data-filter="borrowed"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        <path d="m3 16 4 4 4-4" />
        <path d="M7 20V4" />
        <path d="m21 8-4-4-4 4" />
        <path d="M17 4v16" />
      </svg>
      Emprest.:
      <span class="font-black" id="filter-inv-borrowed">0</span>
    </button>
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('maintenance')"
      class="inv-filter-btn inline-flex items-center justify-center gap-1.5 whitespace-nowrap px-3 py-2.5 rounded-xl bg-rose-100 text-rose-700 text-[11px] sm:text-xs font-bold border border-rose-200 transition-all hover:scale-105"
      data-filter="maintenance"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="shrink-0"
      >
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
        />
      </svg>
      Manuten.:
      <span class="font-black" id="filter-inv-maintenance">0</span>
    </button>
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('late')"
      class="inv-filter-btn inline-flex items-center justify-center gap-1.5 whitespace-nowrap px-3 py-2.5 rounded-xl bg-rose-100 text-rose-700 text-[11px] sm:text-xs font-bold border border-rose-200 transition-all hover:scale-105"
      data-filter="late"
      title="Ferramentas não devolvidas em 7 dias"
    >
      Em Atraso:
      <span class="font-black" id="filter-count-late">0</span>
    </button>
    <button
      type="button"
      onclick="App.CRUDTools.setQuickFilter('maintenance-due')"
      class="inv-filter-btn inline-flex min-w-0 flex-wrap items-center justify-center gap-1 px-2 sm:px-3 py-2.5 rounded-xl bg-orange-100 text-orange-700 text-[11px] sm:text-xs font-bold text-center leading-tight border border-orange-200 transition-all hover:scale-105"
      data-filter="maintenance-due"
      title="Ferramentas com calibração ou revisão vencida"
    >
      Rev. Vencida:
      <span class="font-black" id="filter-count-maintenance-due">0</span>
    </button>
  </div>

  <!-- Barra de Busca, Categoria e Ordenação -->
  <div
    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 sm:p-4 shadow-sm flex flex-col gap-3 lg:flex-row lg:items-center"
  >
    <div class="relative flex-1 w-full">
      <svg
            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" aria-hidden="true"
          ><use href="#icon-search"></use></svg>
      <input
        id="tools-search"
        type="text"
        placeholder="Buscar por nome, patrimônio ou categoria..."
        class="w-full pl-12 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-2xl outline-none text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all shadow-sm"
      />
    </div>
    <!-- Filtro por Categoria -->
    <select
      id="inventory-category-filter"
      class="px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold text-slate-700 dark:text-slate-300 outline-none focus:ring-2 focus:ring-brand-500/20 w-full lg:w-auto"
    >
      <option value="all">Todas as Categorias</option>
    </select>
    <!-- Ordenação -->
    <select
      id="inventory-sort"
      class="px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold text-slate-700 dark:text-slate-300 outline-none focus:ring-2 focus:ring-brand-500/20 w-full lg:w-auto"
    >
      <option value="name-asc">Nome A-Z</option>
      <option value="name-desc">Nome Z-A</option>
      <option value="category">Categoria</option>
      <option value="status">Status</option>
      <option value="recent">Mais Recentes</option>
      <option value="patrimony">Patrimônio</option>
    </select>
  </div>

  <!-- Contador de resultados -->
  <p class="text-xs text-slate-500" id="inventory-result-count" aria-live="polite">
    Mostrando 0 de 0 ferramentas
  </p>

  <!-- Lista/Grid de ferramentas -->
  <div
    id="crud-list"
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4"
  ></div>
  <button
    id="crud-load-more"
    type="button"
    onclick="App.Data.loadMoreCrud()"
    class="w-full py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
  >
    Carregar Mais
  </button>
</div>
</section>
