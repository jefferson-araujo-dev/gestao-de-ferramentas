<section id="tab-management" aria-labelledby="topbar-title" class="tab-content hidden">
  <!-- Tela Ferramentas (Gate 1-F2). Busca, filtros e a lista são montados por App.CRUDTools
       (src/js/modules/tools.js) com os componentes do design system; o título da página (h1) é o do
       shell. Os ids abaixo têm consumidores (auth, scanner, testes): não renomear. -->
  <div id="tools-screen" class="tools-screen">
    <div class="tools-header">
      <div
        class="responsive-action-bar tools-actions"
        role="group"
        aria-label="Ações do inventário"
      >
        <button
          id="tools-action-export"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-tools-action="export"
          title="Exportar lista completa"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-download"></use></svg>
          <span class="ui-btn__label">Exportar</span>
        </button>
        <button
          id="tools-action-import"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-tools-action="import"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-import"></use></svg>
          <span class="ui-btn__label">Importar</span>
        </button>
        <button
          id="tools-action-new"
          type="button"
          class="ui-btn ui-btn--primary"
          data-tools-action="new"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span class="ui-btn__label">Nova</span>
        </button>
      </div>
      <input
        type="file"
        id="crud-import-input-tool"
        class="hidden"
        accept=".xlsx, .xls"
        aria-label="Importar ferramentas de uma planilha Excel"
      />
    </div>

    <!-- Status (com a contagem de cada um): substitui os 4 contadores e os 6 filtros duplicados. -->
    <div
      id="tools-filters"
      class="tools-filters"
      role="group"
      aria-label="Filtrar por status"
    ></div>

    <!-- Busca, categoria e ordenação: renderizados por App.CRUDTools.mountControls (Search/Select). -->
    <div id="tools-toolbar" class="tools-toolbar"></div>

    <div class="tools-meta">
      <p id="inventory-result-count" class="tools-meta__count" aria-live="polite">
        Carregando ferramentas...
      </p>
      <span id="tools-active-filters" class="tools-meta__filters"></span>
      <button
        id="tools-clear-filters"
        type="button"
        class="ui-btn ui-btn--ghost ui-btn--sm"
        data-tools-action="clear-filters"
        hidden
      >
        <span class="ui-btn__label">Limpar filtros</span>
      </button>
    </div>

    <section aria-labelledby="tools-list-title" class="tools-list-section">
      <h2 id="tools-list-title" class="ui-sr-only">Lista de ferramentas</h2>
      <div id="tools-feedback" class="tools-feedback"></div>
      <div id="crud-list" class="tools-list"></div>
      <div class="tools-more">
        <button
          id="crud-load-more"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-tools-action="load-more"
          hidden
        >
          <span class="ui-btn__label">Carregar mais</span>
        </button>
      </div>
    </section>
  </div>
</section>
