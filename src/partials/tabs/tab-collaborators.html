<section id="tab-collaborators" aria-labelledby="topbar-title" class="tab-content hidden">
  <!-- Tela Colaboradores (Gate 1-F3). Filtros, busca e a lista são montados por
       App.CRUDCollaborators (src/js/modules/collaborators.js) com os componentes do design system;
       o título da página (h1) é o do shell. Os ids abaixo têm consumidores (auth, testes): não renomear. -->
  <div id="collab-screen" class="collab-screen">
    <div class="collab-header">
      <div
        class="responsive-action-bar collab-actions"
        role="group"
        aria-label="Ações de colaboradores"
      >
        <button
          id="btn-collaborators-export"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-collab-action="export"
          title="Exportar lista completa"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-download"></use></svg>
          <span class="ui-btn__label">Exportar</span>
        </button>
        <button
          id="btn-collaborators-import"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-collab-action="import"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-import"></use></svg>
          <span class="ui-btn__label">Importar</span>
        </button>
        <button
          id="btn-collaborators-new"
          type="button"
          class="ui-btn ui-btn--primary"
          data-collab-action="new"
        >
          <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span class="ui-btn__label">Novo</span>
        </button>
      </div>
      <input
        type="file"
        id="crud-import-input-collab"
        class="hidden"
        accept=".xlsx, .xls"
        aria-label="Importar colaboradores de uma planilha Excel"
      />
    </div>

    <!-- Situação (com contagem) e pendências continuam sendo dois filtros independentes. -->
    <div class="collab-filters">
      <div
        id="collab-filters"
        class="collab-chips"
        role="group"
        aria-label="Filtrar por situação"
      ></div>
      <div
        id="collab-pending-filters"
        class="collab-chips"
        role="group"
        aria-label="Filtrar por pendências"
      ></div>
    </div>

    <!-- Busca, cargo e ordenação: renderizados por App.CRUDCollaborators.mountControls. -->
    <div id="collab-toolbar" class="collab-toolbar"></div>

    <div class="collab-meta">
      <p id="collab-result-count" class="collab-meta__count" aria-live="polite">
        Carregando colaboradores...
      </p>
      <span id="collab-active-filters" class="collab-meta__filters"></span>
      <button
        id="collab-clear-filters"
        type="button"
        class="ui-btn ui-btn--ghost ui-btn--sm"
        data-collab-action="clear-filters"
        hidden
      >
        <span class="ui-btn__label">Limpar filtros</span>
      </button>
      <div class="ui-switch collab-meta__group">
        <input
          class="ui-switch__input"
          type="checkbox"
          role="switch"
          id="collab-group-toggle"
          checked
        />
        <span class="ui-switch__track" aria-hidden="true"><span class="ui-switch__thumb"></span></span>
        <label class="ui-switch__label" for="collab-group-toggle">Agrupar por cargo</label>
      </div>
    </div>

    <section aria-labelledby="collab-list-title" class="collab-list-section">
      <h2 id="collab-list-title" class="ui-sr-only">Lista de colaboradores</h2>
      <div id="collab-feedback" class="collab-feedback"></div>
      <div id="collab-list" class="collab-list"></div>
      <div class="collab-more">
        <button
          id="collab-load-more"
          type="button"
          class="ui-btn ui-btn--secondary"
          data-collab-action="load-more"
          hidden
        >
          <span class="ui-btn__label">Carregar mais</span>
        </button>
      </div>
    </section>
  </div>
</section>
