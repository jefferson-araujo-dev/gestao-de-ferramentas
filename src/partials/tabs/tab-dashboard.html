<section id="tab-dashboard" aria-labelledby="topbar-title" class="tab-content space-y-3 md:space-y-6">
  <div class="panel-card panel-content">
    <div class="flex flex-wrap justify-end gap-2 md:gap-3 items-center">
      <!-- Exportar -->
      <button
        id="btn-export-dashboard"
        type="button"
        onclick="App.Data.exportExcel()"
        class="ui-btn ui-btn--secondary"
      >
        <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-download"></use></svg>
        <span>Exportar</span>
      </button>
      <div
        class="px-3 md:px-4 py-2 md:py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center gap-2 text-xs md:text-sm text-slate-600 dark:text-slate-300 shrink-0"
      >
        <svg
          class="w-4 h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
          <line x1="16" x2="16" y1="2" y2="6" />
          <line x1="8" x2="8" y1="2" y2="6" />
          <line x1="3" x2="21" y1="10" y2="10" />
        </svg>
        <span id="current-date-full" class="hidden sm:inline">--</span>
        <span id="current-date-full-short" class="sm:hidden">--</span>
      </div>
    </div>
  </div>

  <!-- Indicadores (KPIs): renderizados por App.UI.renderDashboardControls com o componente StatCard -->
  <div id="dash-stats" class="dashboard-grid"></div>

  <!-- Dashboard Analytics Panel -->
  <div class="panel-card panel-content">
    <div class="panel-header">
      <div>
        <h3 class="panel-title">
          Visão Geral
        </h3>
        <p class="text-xs md:text-base text-slate-500 dark:text-slate-400 mt-0.5 md:mt-1">
          Gerencie e monitore o estado do inventário.
        </p>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-4">
      <!-- Status Chart -->
      <div
        class="bg-white dark:bg-slate-900 p-3 md:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col"
      >
      <h4
        class="font-bold text-slate-900 dark:text-white mb-3 flex items-center gap-2 text-sm"
      >
        <svg
          class="w-4 h-4 text-brand-600"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
          <path d="M22 12A10 10 0 0 0 12 2v10z" />
        </svg>
        Status de Ferramentas
      </h4>
      <div class="flex flex-col sm:flex-row items-center gap-4 flex-1 justify-center">
        <div class="relative w-[120px] h-[120px] sm:w-[140px] sm:h-[140px] shrink-0">
          <canvas id="statusChart"></canvas>
        </div>
        <div
          id="chart-legend"
          class="flex flex-row sm:flex-col justify-center gap-3 sm:gap-2 text-[11px] font-semibold text-slate-600 dark:text-slate-300 shrink-0 flex-wrap"
        >
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-emerald-500"></span> Disponível
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-amber-500"></span> Emprestada
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-rose-500"></span> Manutenção
          </div>
        </div>
      </div>
    </div>

    <!-- Category Chart -->
    <div
      class="bg-white dark:bg-slate-900 p-3 md:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col"
    >
      <h4
        class="font-bold text-slate-900 dark:text-white mb-3 flex items-center gap-2 text-sm"
      >
        <svg
          class="w-4 h-4 text-brand-600"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 2v20" />
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        Por Categoria
      </h4>
      <div class="flex flex-col sm:flex-row items-center gap-4 flex-1 justify-center">
        <div
          class="relative w-[120px] h-[120px] sm:w-[140px] sm:h-[140px] shrink-0"
        >
          <canvas id="categoryChart"></canvas>
        </div>
        <div
          id="chart-legend-category"
          class="flex flex-row sm:flex-col justify-center gap-3 sm:gap-2 text-[11px] font-semibold text-slate-600 dark:text-slate-300 shrink-0 flex-wrap"
        >
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-blue-500"></span> Elétrica
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-emerald-500"></span> Manual
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm bg-amber-500"></span> Medição
          </div>
        </div>
      </div>
    </div>

    <!-- Atividades Recentes -->
    <div
      class="bg-white dark:bg-slate-900 p-3 md:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col lg:h-[220px]"
    >
      <div class="flex items-center justify-between mb-3">
        <h4
          class="font-bold text-slate-900 dark:text-white flex items-center gap-2 text-sm"
        >
          <svg
            class="w-4 h-4 text-brand-600"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          Timeline Recente
        </h4>
        <button
          type="button"
          onclick="App.UI.switchTab('history')"
          class="text-[10px] font-bold text-brand-600 hover:text-brand-700 uppercase tracking-wider"
        >
          Ver Tudo
        </button>
      </div>
      <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="dash-mini-timeline">
        <div class="text-center py-4 text-slate-400 text-xs font-semibold">
          Sem movimentações recentes
        </div>
      </div>
    </div>
  </div>
</div>

  <!-- Lista de Ferramentas - Responsive -->
  <div class="space-y-3 md:space-y-4">
    <div class="panel-card panel-content">
      <!-- Quick Filter Buttons -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2" id="quick-filters">
        <button
          type="button"
          data-action="quick-filter"
          class="quick-filter-btn w-full px-2 sm:px-3 py-2.5 rounded-xl bg-emerald-100 text-emerald-700 text-[11px] sm:text-xs font-bold border border-emerald-200 flex flex-wrap items-center justify-center gap-1 text-center"
          data-filter="available"
        >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        Disponíveis:
        <span class="font-black" id="filter-count-available">0</span>
      </button>
      <button
        type="button"
        data-action="quick-filter"
        class="quick-filter-btn w-full px-2 sm:px-3 py-2.5 rounded-xl bg-amber-100 text-amber-700 text-[11px] sm:text-xs font-bold border border-amber-200 flex flex-wrap items-center justify-center gap-1 text-center"
        data-filter="borrowed"
      >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m3 16 4 4 4-4" />
          <path d="M7 20V4" />
          <path d="m21 8-4-4-4 4" />
          <path d="M17 4v16" />
        </svg>
        Emprestadas:
        <span class="font-black" id="filter-count-borrowed">0</span>
      </button>
      <button
        type="button"
        data-action="quick-filter"
        class="quick-filter-btn w-full px-2 sm:px-3 py-2.5 rounded-xl bg-rose-100 text-rose-700 text-[11px] sm:text-xs font-bold border border-rose-200 flex flex-wrap items-center justify-center gap-1 text-center"
        data-filter="maintenance"
      >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          />
        </svg>
        Manutenção:
        <span class="font-black" id="filter-count-maintenance">0</span>
      </button>
      <button
        type="button"
        data-action="quick-filter"
        class="quick-filter-btn w-full px-2 sm:px-3 py-2.5 rounded-xl bg-rose-100 text-rose-700 text-[11px] sm:text-xs font-bold border border-rose-200 flex flex-wrap items-center justify-center gap-1 text-center"
        data-filter="late"
      >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        Em Atraso:
        <span class="font-black" id="filter-count-late-dash">0</span>
      </button>
      <button
        type="button"
        data-action="quick-filter"
        class="quick-filter-btn w-full px-2 sm:px-3 py-2.5 rounded-xl bg-orange-100 text-orange-700 text-[11px] sm:text-xs font-bold border border-orange-200 flex flex-wrap items-center justify-center gap-1 text-center col-span-2 sm:col-span-2 lg:col-span-1"
        data-filter="maintenance-due"
      >
        <svg
          class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Rev. Vencida:
        <span class="font-black" id="filter-count-maint-due-dash">0</span>
      </button>
    </div>

    <!-- Busca, filtro e ordenação: renderizados por App.UI.renderDashboardControls (Search/Select/Button) -->
    <div
      id="dash-toolbar"
      class="flex flex-col md:flex-row items-stretch md:items-center gap-2 md:gap-3 bg-white dark:bg-slate-900 p-3 md:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm"
    ></div>

    <div class="flex items-center justify-between text-xs text-slate-500 px-1">
      <span id="result-count" class="font-medium" aria-live="polite">Carregando...</span>
    </div>

    <div
      id="dash-list"
      class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4"
    ></div>
    <button
      id="dash-load-more"
      type="button"
      onclick="App.Data.loadMoreDash()"
      class="btn btn-secondary w-full py-2.5 md:py-3 text-sm md:text-base"
    >
      Carregar Mais
    </button>
    </div>
  </div>
</section>
