<section id="tab-history" aria-labelledby="topbar-title" class="tab-content hidden space-y-6">
  <!-- Tela Auditoria (Gate 1-F4.D2): tokens e componentes do design system. Os ids abaixo e o
       onclick de #history-load-more têm consumidores (data.js, ui.js e testes): não renomear. -->
  <div class="ui-card p-4 md:p-6 space-y-4">
    <div class="grid gap-4 md:grid-cols-[minmax(240px,1fr)_auto] items-start">
      <div class="min-w-0">
        <h2 class="text-heading-md text-text-primary">Auditoria de Sistema</h2>
        <p class="text-body text-text-secondary mt-1">
          Registro de movimentações e logs do sistema.
        </p>
      </div>
      <div class="ui-field">
        <label class="ui-label ui-sr-only" for="history-time-filter">Período</label>
        <div class="ui-select">
          <select id="history-time-filter" class="ui-control">
            <option value="all">Sempre</option>
            <option value="today">Hoje</option>
            <option value="7days">Últimos 7 Dias</option>
            <option value="30days">Este Mês</option>
          </select>
          <svg class="ui-icon ui-select__chevron" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="ui-field ui-search" role="search">
    <label class="ui-label ui-sr-only" for="history-search">Buscar no histórico</label>
    <div class="ui-search__box">
      <svg class="ui-icon ui-search__icon" aria-hidden="true"><use href="#icon-search"></use></svg>
      <input
        id="history-search"
        type="text"
        autocomplete="off"
        placeholder="Buscar no histórico..."
        class="ui-control ui-search__input"
      />
    </div>
  </div>
  <section aria-labelledby="history-list-title">
    <h2 id="history-list-title" class="ui-sr-only">Registros de auditoria</h2>
    <div id="history-feedback" class="mb-4 empty:hidden"></div>
    <div
      id="history-list"
      class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
    ></div>
  </section>
  <div id="history-load-more-container" class="hidden">
    <button
      id="history-load-more"
      type="button"
      onclick="App.Data.loadMoreHistory()"
      class="ui-btn ui-btn--secondary ui-btn--block"
    >
      <span class="ui-btn__label">Carregar Mais</span>
    </button>
  </div>
</section>
