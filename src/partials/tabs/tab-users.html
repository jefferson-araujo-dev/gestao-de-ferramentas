<section id="tab-users" aria-labelledby="topbar-title" class="tab-content hidden space-y-6">
  <!-- Tela Usuários (Gate 1-F4.D1): tokens e componentes do design system. Os ids, data-* e os
       onclick abaixo têm consumidores (users.js, ui.js e testes): não renomear. -->
  <div class="ui-card p-4 md:p-6 space-y-4">
    <div class="grid gap-4 lg:grid-cols-[minmax(240px,1fr)_auto] items-start">
      <div class="min-w-0">
        <h2 class="text-heading-md text-text-primary">Controle de Acesso e Usuários</h2>
        <p class="text-body text-text-secondary mt-1">
          Gerencie os colaboradores do sistema, atribua permissões e controle acessos.
        </p>
      </div>
      <div class="min-w-0">
        <div
          class="responsive-action-bar flex flex-wrap justify-start lg:justify-end gap-2 items-center w-full lg:w-auto min-w-0 max-w-full"
          role="group"
          aria-label="Ações de usuários"
        >
          <button
            type="button"
            onclick="App.CRUDUsers.exportExcel()"
            class="ui-btn ui-btn--secondary shrink-0"
          >
            <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-download"></use></svg>
            <span class="ui-btn__label">Exportar</span>
          </button>
          <button
            type="button"
            onclick="document.getElementById('crud-import-input-user').click()"
            class="ui-btn ui-btn--secondary shrink-0"
          >
            <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-import"></use></svg>
            <span class="ui-btn__label">Importar</span>
          </button>
          <button
            type="button"
            onclick="App.CRUDUsers.openModal()"
            class="ui-btn ui-btn--primary shrink-0"
          >
            <svg class="ui-icon ui-btn__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            <span class="ui-btn__label">Novo</span>
          </button>
        </div>
        <input
          type="file"
          id="crud-import-input-user"
          class="hidden"
          accept=".xlsx, .xls"
          aria-label="Importar usuários de uma planilha Excel"
          onchange="App.CRUDUsers.importFile(event)"
        />
      </div>
    </div>
    <!-- Contadores: StatCard (valor + rótulo); os ids count-* são atualizados por users.js. -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="users-counters">
      <div class="ui-card ui-stat">
        <span class="ui-stat__value stat-number" id="count-total">-</span>
        <span class="ui-stat__label">Total</span>
      </div>
      <div class="ui-card ui-stat ui-stat--success">
        <span class="ui-stat__value stat-number" id="count-active">-</span>
        <span class="ui-stat__label">Ativos</span>
      </div>
      <div class="ui-card ui-stat ui-stat--info">
        <span class="ui-stat__value stat-number" id="count-admins">-</span>
        <span class="ui-stat__label">Admins</span>
      </div>
      <div class="ui-card ui-stat">
        <span class="ui-stat__value stat-number" id="count-users">-</span>
        <span class="ui-stat__label">Usuários</span>
      </div>
    </div>
  </div>
  <!-- Busca, filtros e ordenação -->
  <div class="space-y-3">
    <div class="ui-field ui-search" role="search">
      <label class="ui-label ui-sr-only" for="users-search">Buscar usuários</label>
      <div class="ui-search__box">
        <svg class="ui-icon ui-search__icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        <input
          id="users-search"
          type="text"
          autocomplete="off"
          placeholder="Buscar por nome, e-mail ou departamento..."
          class="ui-control ui-search__input"
          oninput="App.CRUDUsers.applyFilters()"
        />
      </div>
    </div>
    <!-- Filtros por nível de acesso e status (exclusivos; aria-pressed sincronizado por users.js). -->
    <div class="flex flex-wrap gap-2" id="users-filters" role="group" aria-label="Filtrar usuários">
      <button
        type="button"
        onclick="App.CRUDUsers.setAccessFilter('all')"
        class="ui-btn ui-btn--primary ui-btn--sm"
        data-filter="all"
        aria-pressed="true"
      >
        <span class="ui-btn__label">Todos</span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setAccessFilter('Administrador')"
        class="ui-btn ui-btn--secondary ui-btn--sm"
        data-filter="Administrador"
        aria-pressed="false"
      >
        <span class="ui-btn__label">Administradores</span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setAccessFilter('Usuario Padrao')"
        class="ui-btn ui-btn--secondary ui-btn--sm"
        data-filter="Usuario Padrao"
        aria-pressed="false"
      >
        <span class="ui-btn__label">Usuários Padrão</span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setAccessFilter('Ativo')"
        class="ui-btn ui-btn--secondary ui-btn--sm"
        data-filter="Ativo"
        aria-pressed="false"
      >
        <span class="ui-btn__label">Ativos</span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setAccessFilter('Inativo')"
        class="ui-btn ui-btn--secondary ui-btn--sm"
        data-filter="Inativo"
        aria-pressed="false"
      >
        <span class="ui-btn__label">Inativos</span>
      </button>
    </div>
    <!-- Ordenação: a seta (.sort-indicator) mostra o campo e o sentido atuais. -->
    <div
      class="flex flex-wrap items-center gap-2 pt-2 border-t border-border"
      role="group"
      aria-labelledby="users-sort-label"
    >
      <span id="users-sort-label" class="text-label text-text-secondary">Ordenar:</span>
      <button
        type="button"
        onclick="App.CRUDUsers.setSort('name')"
        class="sort-btn ui-btn ui-btn--secondary ui-btn--sm"
        data-sort="name"
      >
        <span class="ui-btn__label">Nome <span class="sort-indicator"></span></span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setSort('email')"
        class="sort-btn ui-btn ui-btn--secondary ui-btn--sm"
        data-sort="email"
      >
        <span class="ui-btn__label">Email <span class="sort-indicator"></span></span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setSort('lastLogin')"
        class="sort-btn ui-btn ui-btn--secondary ui-btn--sm"
        data-sort="lastLogin"
      >
        <span class="ui-btn__label">Último Login <span class="sort-indicator"></span></span>
      </button>
      <button
        type="button"
        onclick="App.CRUDUsers.setSort('status')"
        class="sort-btn ui-btn ui-btn--secondary ui-btn--sm"
        data-sort="status"
      >
        <span class="ui-btn__label">Status <span class="sort-indicator"></span></span>
      </button>
    </div>
  </div>

  <section aria-labelledby="users-list-title">
    <h2 id="users-list-title" class="ui-sr-only">Lista de usuários</h2>
    <div id="users-feedback" class="mb-4 empty:hidden"></div>
    <div
      id="user-management-body"
      class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
    ></div>
  </section>
</section>
