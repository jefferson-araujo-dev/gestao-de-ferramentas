<header
  class="bg-white/80 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 h-16 flex items-center justify-between px-4 xl:px-8 z-30"
>
  <div class="flex items-center gap-4">
    <button
      id="btn-sidebar-toggle"
      type="button"
      class="shell-toggle"
      aria-label="Menu de navegação"
      aria-controls="main-sidebar"
      aria-expanded="false"
      title="Recolher menu lateral"
    >
      <svg class="w-6 h-6 shrink-0" aria-hidden="true" focusable="false">
        <use href="#icon-menu"></use>
      </svg>
    </button>
    <h1
      id="topbar-title"
      class="text-lg font-bold text-slate-900 dark:text-white tracking-tight"
    >
      Painel
    </h1>
    <div
      class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-brand-50 border border-brand-100 rounded-lg text-[11px] font-bold text-brand-700 uppercase tracking-wider ml-2"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-building-2 w-3.5 h-3.5"
      >
        <path d="M10 12h4"></path>
        <path d="M10 8h4"></path>
        <path d="M14 21v-3a2 2 0 0 0-4 0v3"></path>
        <path
          d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"
        ></path>
        <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>
      </svg>
      <span id="tenant-name">Gestão de Ferramentas</span>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <div class="flex items-center justify-center gap-2 mr-4">
      <div
        id="network-status-dot"
        class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
      ></div>
      <span
        id="network-status-text"
        class="text-[10px] font-bold text-slate-400 uppercase tracking-wider hidden md:block"
        >Sistema Online</span
      >
    </div>
    <div class="relative" id="user-menu-container" data-dropdown>
      <button
        type="button"
        id="user-menu-trigger"
        data-testid="user-menu-trigger"
        aria-label="Menu da conta"
        class="flex items-center gap-3 p-1 pr-3 rounded-full border border-slate-200/60 hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all bg-white dark:bg-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20"
      >
        <div
          class="w-8 h-8 rounded-full bg-brand-50 dark:bg-brand-900/30 border border-brand-100 dark:border-brand-800 flex items-center justify-center overflow-hidden text-brand-600"
          id="user-avatar"
        >
          <svg
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            class="w-full h-full p-1.5 fill-current"
          >
            <path
              d="M15.71,12.71a6,6,0,1,0-7.42,0,10,10,0,0,0-6.22,8.18,1,1,0,0,0,2,.22,8,8,0,0,1,15.9,0,1,1,0,0,0,1,.89h.11a1,1,0,0,0,.88-1.1A10,10,0,0,0,15.71,12.71ZM12,12a4,4,0,1,1,4-4A4,4,0,0,1,12,12Z"
            ></path>
          </svg>
        </div>
        <div class="text-left hidden md:block">
          <p
            class="text-xs font-bold text-slate-900 dark:text-white leading-none"
            id="user-name"
          >
            Jefferson
          </p>
          <p
            class="text-[10px] font-medium text-slate-500 dark:text-slate-400 mt-0.5 uppercase tracking-wider"
            id="user-role"
          >
            Administrador
          </p>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-chevron-down w-4 h-4 text-slate-400 ml-1"
        >
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>

      <!-- Menu da CONTA (componente Dropdown: teclado, Esc, clique fora). Ações sem onclick inline:
           data-menu-action é tratado por App.UI. A seção "Dados (transitório)" segue como dívida
           documentada até a tela Dados e backup. -->
      <div id="user-dropdown-menu" class="ui-menu" aria-label="Menu da conta">
        <button id="btn-profile-modal" type="button" role="menuitem" class="ui-menu__item" data-menu-action="profile">
          <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Meu Perfil
        </button>
        <button id="btn-password-modal" type="button" role="menuitem" class="ui-menu__item" data-menu-action="password">
          <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Alterar Senha
        </button>
        <button id="btn-dark-mode" type="button" role="menuitem" class="ui-menu__item" data-menu-action="theme">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="dark-mode-icon" class="w-4 h-4 shrink-0" aria-hidden="true" focusable="false">
            <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path>
          </svg>
          <span id="dark-mode-text">Modo Noturno</span>
        </button>

        <div id="admin-tools" role="group" aria-labelledby="admin-tools-heading">
          <div class="ui-menu__sep" role="separator"></div>
          <p class="ui-menu__label" id="admin-tools-heading">Dados (transitório)</p>
          <label class="ui-menu__item" role="menuitem">
            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path>
              <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
              <path d="M8 13h2"></path>
              <path d="M14 13h2"></path>
              <path d="M8 17h2"></path>
              <path d="M14 17h2"></path>
            </svg>
            Importar Excel
            <input type="file" accept=".xlsx,.xls" id="file-import-excel" class="hidden" />
          </label>
          <button id="btn-reset-data" type="button" role="menuitem" class="ui-menu__item ui-menu__item--danger" data-menu-action="reset">
            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
              <path d="M3 6h18"></path>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Resetar dados operacionais
          </button>
          <button id="btn-export-json" type="button" role="menuitem" class="ui-menu__item" data-menu-action="export-json">
            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
              <path d="M3 12A9 3 0 0 0 21 12"></path>
            </svg>
            Backup JSON
          </button>
          <label class="ui-menu__item" role="menuitem">
            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 13v8"></path>
              <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
              <path d="m8 17 4-4 4 4"></path>
            </svg>
            Restaurar JSON
            <input type="file" accept=".json" id="file-restore-json" class="hidden" />
          </label>
          <button id="btn-metrics-report" type="button" role="menuitem" class="ui-menu__item" data-menu-action="metrics">
            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <line x1="18" x2="18" y1="20" y2="10"></line>
              <line x1="12" x2="12" y1="20" y2="4"></line>
              <line x1="6" x2="6" y1="20" y2="14"></line>
            </svg>
            Métricas do Sistema
          </button>
        </div>

        <div class="ui-menu__sep" role="separator"></div>
        <button id="btn-logout-header" type="button" role="menuitem" class="ui-menu__item ui-menu__item--danger" data-menu-action="logout">
          <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m16 17 5-5-5-5"></path>
            <path d="M21 12H9"></path>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          </svg>
          Sair do Sistema
        </button>
      </div>
    </div>
  </div>
</header>
