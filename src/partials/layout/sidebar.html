<!-- Overlay do drawer (tablet) e do rail expandido (notebook). Controlado por App.Shell. -->
<div id="sidebar-overlay" class="shell-overlay hidden" aria-hidden="true"></div>

<!-- Sidebar: fixa; o espaço no layout é reservado por #sidebar-spacer. Estados via data-state. -->
<aside id="main-sidebar" class="shell-sidebar" data-state="expanded">
  <div class="shell-brand">
    <div class="shell-brand-mark" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
        />
      </svg>
    </div>
    <div id="sidebar-logo-text" class="shell-brand-text">
      <p class="shell-brand-name">Ferramentas</p>
      <p class="shell-brand-tagline">Gestão de ativos</p>
    </div>
  </div>

  <!-- Itens gerados por App.Shell a partir de src/js/config/navigation.js -->
  <nav id="sidebar-nav" class="shell-nav" aria-label="Navegação principal"></nav>

  <div class="shell-sidebar-footer">
    <button
      id="btn-install-pwa"
      type="button"
      data-pwa-install
      class="hidden shell-footer-item"
      title="Instalar o Sistema no Dispositivo"
    >
      <svg class="shell-nav-icon" aria-hidden="true" focusable="false">
        <use href="#icon-download"></use>
      </svg>
      <span class="shell-nav-label">Instalar App</span>
    </button>

    <button
      id="btn-logout-sidebar"
      type="button"
      onclick="App.Auth.logout()"
      class="shell-footer-item shell-footer-danger"
      title="Sair do Sistema"
    >
      <svg class="shell-nav-icon" aria-hidden="true" focusable="false">
        <use href="#icon-logout"></use>
      </svg>
      <span class="shell-nav-label">Sair da Conta</span>
    </button>
  </div>
</aside>

<!-- Reserva, no fluxo, a largura ocupada pela sidebar fixa (256/72px; 0 em tablet/mobile). -->
<div id="sidebar-spacer" class="shell-spacer" aria-hidden="true"></div>
