<div
  id="login-screen"
  class="fixed inset-0 z-[60] flex overflow-y-auto bg-slate-50"
>
  <!-- Left Side - Image Panel -->
  <div
    class="hidden lg:flex lg:w-1/2 relative overflow-hidden"
    style="
      background-image: url('https://images.unsplash.com/photo-1731694411560-050e5b91e943?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
    "
  >
    <!-- Overlay -->
    <div class="absolute inset-0 bg-slate-900/80"></div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col justify-between p-12 w-full">
      <!-- Top - Logo -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-brand-600 rounded-xl flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-white"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">Gestão de Ferramentas</h1>
        </div>
      </div>

      <!-- Bottom - Hero Text -->
      <div class="max-w-lg">
        <h2 class="text-5xl font-extrabold text-white leading-tight mb-6">
          Controle total do<br />seu patrimônio.
        </h2>
        <p class="text-[#CBD5E1] text-lg leading-relaxed">
          Sistema corporativo avançado para gestão de ferramentas, colaboradores e manutenções
          com sincronização em tempo real.
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div class="flex-1 flex min-h-full items-center justify-center p-4 sm:p-8 bg-white">
    <div class="w-full max-w-md">
      <!-- Mobile Logo (visible only on small screens) -->
      <div class="lg:hidden flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-white"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900">Gestão de Ferramentas</h1>
        </div>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-slate-900 mb-2">Gestão de Ferramentas</h2>
          <p class="text-slate-500 text-sm">Insira suas credenciais para acessar o painel.</p>
        </div>

        <form id="login-form" class="space-y-5">
          <!-- Email Field -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2"> E-mail </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg
                  class="h-5 w-5 text-slate-400"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </div>
              <input
                id="login-email"
                type="email"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-blue-50 border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all text-slate-900 placeholder-slate-400"
                placeholder="nome@empresa.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-semibold text-slate-700"> Senha </label>
              <button
                type="button"
                id="btn-forgot-password"
                class="text-sm font-semibold text-brand-600 hover:text-brand-700 hover:underline bg-transparent border-none cursor-pointer p-0"
              >
                Primeiro acesso ou esqueceu a senha?
              </button>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg
                  class="h-5 w-5 text-slate-400"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </div>
              <input
                id="login-password"
                type="password"
                class="w-full pl-10 pr-12 py-3 rounded-xl bg-blue-50 border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all text-slate-900 placeholder-slate-400"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="toggle-password"
                aria-label="Mostrar ou ocultar a senha"
                aria-controls="login-password"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
              >
                <svg
                  class="h-5 w-5"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Login Button -->
          <button
            type="submit"
            id="btn-login"
            class="btn btn-primary w-full py-3.5 mt-6 font-bold shadow-lg shadow-brand-600/30 active:scale-95"
          >
            <span id="login-text">Acessar Sistema</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
